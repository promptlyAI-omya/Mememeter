    <meta name="twitter:card" content="summary_large_image" />

        content="Will your crush reply or leave you on seen? Calculate your reply chance now." />

    <!-- ══ Fonts & Libraries ═════════════════════════════════ -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap"
        rel="stylesheet" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js" defer></script>

    <link rel="stylesheet" href="../css/style.css" />
</head>

<body>

    <!-- AD SLOT TOP -->
    <div class="ad-slot" id="ad-top">
        <span class="ad-placeholder">Ad Space</span>
    </div>

    <main class="engine-container" id="app">

        <!-- ===== HEADER ===== -->
        <header class="engine-header">
            <h1 class="engine-logo">
                Reply<span class="logo-accent">Meter</span><span class="logo-dot">.help</span>
            </h1>
            <p class="engine-tagline">Will Your Crush Reply? 💘</p>
        </header>

        <!-- ===== INPUT / WIZARD SECTION ===== -->
        <section id="rm-input-section">
            <div class="input-card">

                <!-- Progress Dots -->
                <div class="rm-progress" id="rm-progress">
                    <span class="rm-dot active" data-step="0">1</span>
                    <span class="rm-dot" data-step="1">2</span>
                    <span class="rm-dot" data-step="2">3</span>
                    <span class="rm-dot" data-step="3">4</span>
                    <span class="rm-dot" data-step="4">5</span>
                </div>

                <!-- Wizard Steps Container -->
                <div id="rm-wizard" class="rm-wizard"></div>

            </div>
        </section>

        <!-- ===== LOADING SECTION ===== -->
        <section class="rm-loading-section hidden" id="rm-loading-section">
            <div class="rm-typing-bubble">
                <span class="rm-typing-dot"></span>
                <span class="rm-typing-dot"></span>
                <span class="rm-typing-dot"></span>
            </div>
            <p class="loading-msg" id="rm-loading-msg">Typing status detect ho raha hai…</p>
        </section>

        <!-- ===== RESULT SECTION ===== -->
        <section class="result-section hidden" id="rm-result-section">

            <!-- Result Card (1:1 square for export) -->
            <div class="rm-result-card rm-glow-green" id="rm-result-card">
                <div class="rm-card-inner">
                    <p class="meme-card-header">ReplyMeter Result 💘</p>
                    <div class="rm-percent-wrap">
                        <span class="rm-percent" id="rm-percent">0%</span>
                    </div>
                    <h2 class="rm-range-title" id="rm-range-title">Loading…</h2>
                    <p class="rm-dialogue" id="rm-dialogue">…</p>
                    <p class="meme-card-footer">Check yours at <strong>promptly.help</strong></p>
                </div>
            </div>

            <!-- Audio Controls -->
            <div class="audio-controls">
                <button class="audio-btn" id="rm-sound-btn" title="Replay Sound">🔊 <span>Replay</span></button>
                <button class="audio-btn" id="rm-mute-btn" title="Mute / Unmute">🔈 <span>Mute</span></button>
            </div>

            <!-- Action Buttons -->
            <div class="action-row">
                <button class="action-btn" id="rm-download-btn" title="Download Result Card">
                    📥 <span>Download</span>
                </button>
                <button class="action-btn" id="rm-share-btn" title="Share on WhatsApp">
                    📤 <span>Share</span>
                </button>
                <button class="action-btn" id="rm-friend-btn" title="Check a Friend">
                    👥 <span>Check Friend</span>
                </button>
                <button class="action-btn" id="rm-retry-btn" title="Try Again">
                    🔄 <span>Try Again</span>
                </button>
            </div>

        </section>

        <!-- AD SLOT RESULT -->
        <div class="ad-slot" id="ad-result">
            <span class="ad-placeholder">Ad Space</span>
        </div>

    </main>

    <!-- AD SLOT STICKY -->
    <div class="ad-slot ad-slot--sticky" id="ad-sticky">
        <span class="ad-placeholder">Ad Space</span>
    </div>

    <!-- Global audio element -->
    <audio id="rmAudio" preload="none"></audio>

    <!-- ReplyMeter Engine -->
    <script src="../js/replymeter.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            ReplyMeter.init();
        });
    </script>

</body>

</html>
