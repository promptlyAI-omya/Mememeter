<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- ══ Primary SEO ═══════════════════════════════════════ -->
    <title>Next30 – What's Shifting? | Deep Emotional Shift Analysis</title>
    <meta name="description"
        content="Next30 — discover what's silently shifting in your next 30 days. A deep, cinematic emotional analysis based on your hidden patterns. Free, instant, no astrology." />
    <meta name="keywords"
        content="next30, what is shifting, emotional shift test, hidden pattern analysis, life change prediction, silent growth, deep personality test, emotional reset, next 30 days, self awareness test, inner shift quiz, psychological analysis free" />
    <meta name="author" content="promptly.help" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://mememeter.promptly.help/engines/next30.html" />
    <meta name="theme-color" content="#06060e" />

    <!-- ══ Open Graph ════════════════════════════════════════ -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="promptly.help" />
    <meta property="og:title" content="Next30 – What's Shifting? 🔮" />
    <meta property="og:description"
        content="Something is silently shifting. Discover your Next30 reveal — deep, cinematic, personal." />
    <meta property="og:url" content="https://mememeter.promptly.help/engines/next30.html" />
    <meta property="og:image" content="https://mememeter.promptly.help/og-image.png?v=1" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="en_IN" />

    <!-- ══ Twitter Card ══════════════════════════════════════ -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Next30 – What's Shifting? 🔮" />
    <meta name="twitter:description" content="Something is silently shifting. Discover your Next30 reveal." />
    <meta name="twitter:image" content="https://mememeter.promptly.help/og-image.png?v=1" />

    <!-- ══ Fonts & Libraries ═════════════════════════════════ -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap"
        rel="stylesheet" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js" defer></script>

    <link rel="stylesheet" href="../css/style.css" />
</head>

<body>

    <!-- Cinematic darkening overlay -->
    <div class="n30-overlay" id="n30-overlay"></div>

    <!-- AD SLOT TOP -->
    <div class="ad-slot" id="ad-top">
        <span class="ad-placeholder">Ad Space</span>
    </div>

    <main class="engine-container" id="app">

        <!-- ===== HEADER ===== -->
        <header class="engine-header">
            <h1 class="engine-logo">
                Next<span class="logo-accent">30</span><span class="logo-dot">.help</span>
            </h1>
            <p class="engine-tagline">What's Shifting? 🔮</p>
        </header>

        <!-- ===== INPUT / WIZARD SECTION ===== -->
        <section id="n30-input-section">
            <div class="input-card n30-card-dark">

                <!-- Progress Dots -->
                <div class="n30-progress" id="n30-progress">
                    <span class="n30-dot active" data-step="0">1</span>
                    <span class="n30-dot" data-step="1">2</span>
                    <span class="n30-dot" data-step="2">3</span>
                    <span class="n30-dot" data-step="3">4</span>
                </div>

                <!-- Wizard Steps Container -->
                <div id="n30-wizard" class="n30-wizard"></div>

            </div>
        </section>

        <!-- ===== LOADING SECTION ===== -->
        <section class="n30-loading-section hidden" id="n30-loading-section">
            <div class="n30-pulse-ring"></div>
            <p class="n30-loading-msg" id="n30-loading-msg">Emotional timeline aligning…</p>
        </section>

        <!-- ===== RESULT SECTION ===== -->
        <section class="result-section hidden" id="n30-result-section">

            <!-- Result Card -->
            <div class="n30-result-card n30-glow-emotional" id="n30-result-card">
                <p class="n30-result-header">NEXT30 REVEAL</p>
                <div class="n30-mode-icon" id="n30-mode-icon">🔮</div>
                <h2 class="n30-mode-title" id="n30-mode-title">Loading…</h2>

                <!-- 4 Structured Blocks -->
                <div class="n30-blocks">
                    <div class="n30-block">
                        <p class="n30-block-label">Quiet Shift</p>
                        <p class="n30-block-text" id="n30-block-shift">…</p>
                    </div>
                    <div class="n30-block">
                        <p class="n30-block-label">External Signal</p>
                        <p class="n30-block-text" id="n30-block-signal">…</p>
                    </div>
                    <div class="n30-block">
                        <p class="n30-block-label">Internal Truth</p>
                        <p class="n30-block-text" id="n30-block-truth">…</p>
                    </div>
                    <div class="n30-block">
                        <p class="n30-block-label">Guidance</p>
                        <p class="n30-block-text" id="n30-block-guidance">…</p>
                    </div>
                </div>

                <p class="n30-closing" id="n30-closing"></p>
            </div>

            <!-- Action Buttons -->
            <div class="action-row n30-actions">
                <button class="action-btn" id="n30-recalc-btn" title="Recalculate">
                    🔄 <span>Recalculate</span>
                </button>
                <button class="action-btn" id="n30-share-btn" title="Share on WhatsApp">
                    📤 <span>Share</span>
                </button>
                <button class="action-btn" id="n30-download-btn" title="Download Card">
                    📥 <span>Download</span>
                </button>
            </div>

            <!-- AD SLOT RESULT -->
            <div class="ad-slot" id="ad-result">
                <span class="ad-placeholder">Ad Space</span>
            </div>

        </section>

        <!-- ===== HIDDEN EXPORT CARD (1:1 for html2canvas) ===== -->
        <div class="n30-export-card hidden" id="n30-export-card">
            <div class="n30-export-inner">
                <p class="n30-export-header">NEXT30 REVEAL</p>
                <h2 class="n30-export-title" id="n30-export-title">…</h2>
                <p class="n30-export-summary" id="n30-export-summary">…</p>
                <p class="n30-export-closing">You felt this before reading… didn't you?</p>
                <p class="n30-export-footer">promptly.help</p>
            </div>
        </div>

    </main>

    <!-- AD SLOT STICKY -->
    <div class="ad-slot ad-slot--sticky" id="ad-sticky">
        <span class="ad-placeholder">Ad Space</span>
    </div>

    <!-- Next30 Engine -->
    <script src="../js/next30.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            Next30.init();
        });
    </script>

</body>

</html>
